class PatternEngine{static gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a}static orbit(n,step,direction=1){const sequence=[],seen=new Set;let current=0,signed=direction*step;while(!seen.has(current)){seen.add(current);sequence.push(current);current=(current+signed+n)%n}return sequence}static starStep(n){for(let step=Math.floor((n-1)/2);step>1;step--)if(this.gcd(n,step)===1)return step;return null}static generate(type,n,requestedStep=1,direction=1){let step=Math.max(1,Math.min(n-1,requestedStep)),sequence,label=type[0].toUpperCase()+type.slice(1),rule,cycles=null,gcd=null,closed=true;if(type==='around')step=1;if(type==='skip')step=Math.min(2,n-1);if(type==='star')step=this.starStep(n);if(['step','around','skip','star'].includes(type)){if(step===null)return null;sequence=this.orbit(n,step,direction);gcd=this.gcd(n,step);cycles=gcd;rule=`${direction>0?'+':'−'}${step} mod ${n}`}else if(type==='mirror'){step=null;const base=[];for(let left=0,right=n-1;left<=right;left++,right--){base.push(left);if(right!==left)base.push(right)}sequence=base.map(i=>direction>0?i:(n-i)%n);rule='symmetric pairs'}else{step=null;const base=[...Array(n).keys(),...Array.from({length:Math.max(0,n-2)},(_,i)=>n-2-i)];sequence=base.map(i=>direction>0?i:(n-i)%n);rule='forward, then reverse'}const unique=new Set(sequence).size,k=step===null?null:Math.min(step,n-step),notation=step!==null&&gcd===1&&k>1&&k<n/2?`{${n}/${k}}`:null;return{type,label,n,step,direction,sequence,unique,cycles,gcd,rule,notation,closed,length:sequence.length,visitsAll:unique===n,explanation:gcd===null?`${unique} unique vertices arranged by ${rule}.`:gcd===1?`GCD(${n}, ${step}) = 1. Every vertex is visited before repeating.`:`GCD(${n}, ${step}) = ${gcd}. One orbit visits ${unique} of ${n} vertices; the rule forms ${gcd} cycles.`}}}
class AudioEngine{constructor(){this.context=null;this.output=null}async ready(){if(!this.context){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Web Audio is unavailable');this.context=new AC;this.output=this.context.createGain();this.output.gain.value=.72;this.output.connect(this.context.destination)}if(this.context.state==='suspended')await this.context.resume();return this.context}async note(frequency,duration=.75,delay=0){const context=await this.ready(),start=context.currentTime+delay,osc=context.createOscillator(),filter=context.createBiquadFilter(),gain=context.createGain();osc.type='triangle';osc.frequency.value=frequency;filter.type='lowpass';filter.frequency.value=1900;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.16,start+.025);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);osc.connect(filter);filter.connect(gain);gain.connect(this.output);osc.start(start);osc.stop(start+duration+.04);osc.onended=()=>{osc.disconnect();filter.disconnect();gain.disconnect()}}chord(form,octave){form.notes.forEach((note,i)=>this.note(note*2**octave,2.2,i*.018))}}

setControl(id,value){const formats={rotation:v=>v===0?'Stopped':`${Math.abs(v)} ${v>0?'↻':'↺'}`,tempo:v=>`${v} bpm`,octave:v=>v===0?'Normal':v>0?'+1 high':'−1 low',intensity:v=>`${v}%`};$('#'+id+'Out').value=formats[id](value);$('#'+id).setAttribute('aria-valuetext',formats[id](value));if(id==='rotation')this.rotation=value;if(id==='octave')this.octave=value;if(id==='intensity'){this.intensity=value/100;this.pulse=.35}}

toggleRecording(){if(this.sequence.recording)this.sequence.finishRecording();else{this.path=[];this.patternPreview=null;this.appliedPattern=null;this.activeEdge=null;this.sequence.startRecording();this.pulse=.45;this.updateMath()}this.updateSequenceUI()}clearPattern(){this.path=[];this.patternPreview=null;this.appliedPattern=null;this.activeEdge=null;this.sequence.clear();this.pulse=.45;$('#patternInfo').innerHTML='<strong>Choose a rule</strong>Preview its geometry, then use the pattern.';this.updateMath();this.announce('Sequence and pattern cleared')}randomize(){const keys=Object.keys(FORMS),n=+keys[Math.floor(Math.random()*keys.length)];this.selectShape(n,false);const choices=['around','skip','mirror','bounce',...(PatternEngine.starStep(n)?['star']:[])];this.patternType=choices[Math.floor(Math.random()*choices.length)];this.patternStep=1+Math.floor(Math.random()*(n-1));this.patternDirection=Math.random()>.5?1:-1;this.rotation=(Math.random()>.5?1:-1)*(20+Math.floor(Math.random()*65));$('#rotation').value=this.rotation;this.setControl('rotation',this.rotation);this.configurePatternControls();this.updatePatternPreview();this.applyPattern();this.sequence.play(()=>+$('#tempo').value);const button=$('#randomize');button.classList.add('feedback');setTimeout(()=>button.classList.remove('feedback'),700);this.announce(`Surprise ${this.form.name}, ${this.patternPreview.label} pattern`)}

updateMath(){const m=polygonMath(this.sides),fmt=v=>Number.isInteger(v)?v:v.toFixed(1);$('#mathGrid').innerHTML=`<dt>Sides</dt><dd>${this.sides}</dd><dt>Vertices</dt><dd>${this.sides}</dd><dt>Interior angle</dt><dd>${fmt(m.interior)}°</dd><dt>Exterior angle</dt><dd>${fmt(m.exterior)}°</dd><dt>Angle sum</dt><dd>${m.sum}°</dd><dt>Rotational order</dt><dd>${m.symmetry}</dd>`;$('#formula').textContent=`Interior angle: (${this.sides} − 2) × 180° ÷ ${this.sides} = ${fmt(m.interior)}°`;const pattern=this.patternPreview||this.appliedPattern,section=$('#patternMath');section.hidden=!pattern;if(pattern)section.innerHTML=`<strong>Pattern · ${pattern.label}${pattern.notation?` ${pattern.notation}`:''}</strong>Rule: ${pattern.rule}<br>Visited: ${pattern.unique} / ${pattern.n}<br>${pattern.gcd===null?'Symmetry rule':`GCD: ${pattern.gcd} · Cycles: ${pattern.cycles}`}<br>${pattern.explanation}`}
newChallenge(){const m=polygonMath(this.sides),items=[['How many vertices does this polygon have?',this.sides],['What is each exterior angle?',m.exterior],['What is the sum of its interior angles?',m.sum],['How many lines of symmetry does it have?',m.symmetry]],pattern=this.patternPreview||this.appliedPattern;if(pattern){items.push(['How many unique vertices does this pattern visit?',pattern.unique]);if(pattern.step!==null)items.push(['Which step size generates this pattern?',pattern.step]);if(pattern.cycles!==null)items.push(['How many cycles does this step rule create?',pattern.cycles])}const pick=items[Math.floor(Math.random()*items.length)],correct=Math.round(pick[1]*10)/10,values=new Set([correct]);while(values.size<4)values.add(Math.max(1,correct+[-20,-10,-2,-1,1,2,10,20][Math.floor(Math.random()*8)]));$('#question').textContent=pick[0];$('#answers').innerHTML='';$('#feedback').textContent='';[...values].sort(()=>Math.random()-.5).forEach(value=>{const b=document.createElement('button');b.className='answer';b.textContent=`${value}${pick[0].includes('angle')?'°':''}`;b.addEventListener('click',()=>{const ok=value===correct;b.classList.add(ok?'correct':'wrong');$('#feedback').textContent=ok?'Exactly — geometry in tune.':'Not quite. Follow the polygon, then try again.';if(ok)setTimeout(()=>this.newChallenge(),1100)});$('#answers').appendChild(b)})}
keydown(e){if(e.target.tagName==='INPUT')return;const number=+e.key;if(FORMS[number]){e.preventDefault();this.selectShape(number);return}if(e.code==='Space'){e.preventDefault();this.playChord()}else if(e.key.toLowerCase()==='r'){e.preventDefault();this.randomize()}else if(e.key.toLowerCase()==='c'){e.preventDefault();this.clearPattern()}}canvasKeydown(e){if(['ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();this.focusedVertex=(this.focusedVertex+1)%this.sides;this.announce(`Vertex ${this.focusedVertex+1}, note ${this.form.names[this.focusedVertex]}`)}else if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();this.focusedVertex=(this.focusedVertex-1+this.sides)%this.sides;this.announce(`Vertex ${this.focusedVertex+1}, note ${this.form.names[this.focusedVertex]}`)}else if(e.key==='Enter'){e.preventDefault();this.playVertex(this.focusedVertex)}}
updateSequenceUI(){const s=this.sequence,has=s.hasSteps,hasPattern=this.path.length>0||!!this.appliedPattern,record=$('#record'),play=$('#playSequence'),loop=$('#loop'),stop=$('#stop'),clear=$('#clear'),indicator=$('#sequenceIndicator'),pattern=this.appliedPattern,patternName=pattern?`${pattern.label}${pattern.step!==null?` ${pattern.step}`:''}`:null;record.disabled=s.playing;record.classList.toggle('recording',s.recording);record.textContent=s.recording?'■ Finish recording':'● Record';play.disabled=!has||s.recording||s.playing;play.classList.toggle('active',s.playing);play.textContent=s.playing?'▶ Playing':'▶ Play';loop.disabled=!has;loop.classList.toggle('active',s.loopEnabled);loop.setAttribute('aria-pressed',String(s.loopEnabled));stop.disabled=!s.recording&&!s.playing;clear.disabled=!has&&!hasPattern;indicator.className='sequence-indicator';let text='No sequence · press Record to begin';if(s.recording){text=`Recording · ${s.steps.length} ${s.steps.length===1?'note':'notes'} · click vertices`;indicator.classList.add('recording')}else if(s.playing){text=`${s.loopEnabled?'Loop':'Playing'} · ${patternName?patternName+' · ':''}${Math.max(1,s.playhead)} / ${s.steps.length}`;indicator.classList.add('live')}else if(has&&s.loopEnabled){text=`Loop on · ${patternName?patternName+' · ':''}${s.steps.length} notes · press Play`;indicator.classList.add('live')}else if(has)text=`${patternName?'Pattern · '+patternName:'Sequence ready'} · ${s.steps.length} notes · press Play`;else if(hasPattern)text=`Pattern · ${this.path.length} vertices · press Record to capture`;indicator.textContent=text;$('#sequenceStatus').textContent=text}showNote(text){const el=$('#notePop');el.textContent=text;el.classList.add('show');clearTimeout(this.popTimer);this.popTimer=setTimeout(()=>el.classList.remove('show'),650);this.announce(`Note ${text}`)}flashAudio(){$('#audioStatus').classList.add('sound-on');setTimeout(()=>$('#audioStatus').classList.remove('sound-on'),600)}audioError(error){$('#audioSt drawPolygon(points){const c=this.ctx;c.beginPath();points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath()}
drawSequence(points,sequence,{alpha=.4,width=1,dashed=false,closed=true}={}){if(!sequence||sequence.length<2)return;const c=this.ctx;c.save();c.strokeStyle=this.form.color;c.lineWidth=width;c.globalAlpha=alpha;c.shadowColor=this.form.color;c.shadowBlur=8*this.intensity;if(dashed)c.setLineDash([4,6]);c.beginPath();sequence.forEach((index,i)=>{const p=points[index%this.sides];i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)});if(closed){const first=points[sequence[0]%this.sides];c.lineTo(first.x,first.y)}c.stroke();c.restore()}
draw(){const c=this.ctx,w=this.canvas.clientWidth,h=this.canvas.clientHeight,x=w/2,y=h/2,outer=Math.min(w,h)*.475,points=this.vertices();c.clearRect(0,0,w,h);c.lineWidth=1;c.strokeStyle='#f4f0e829';c.beginPath();c.arc(x,y,outer,0,TAU);c.stroke();for(let r=1;r<=3;r++){c.strokeStyle=`rgba(244,240,232,${.025+r*.008})`;c.beginPath();c.arc(x,y,outer*r/4,0,TAU);c.stroke()}for(let i=0;i<24;i++){const a=i*TAU/24,z=outer*(i%6===0?.94:.97);c.strokeStyle=i%6===0?'#f4f0e838':'#f4f0e814';c.beginPath();c.moveTo(x+Math.cos(a)*z,y+Math.sin(a)*z);c.lineTo(x+Math.cos(a)*outer,y+Math.sin(a)*outer);c.stroke()}c.save();c.shadowColor=this.form.color;c.shadowBlur=(20+this.pulse*24)*this.intensity;c.strokeStyle=this.form.color;c.lineWidth=1.5;this.drawPolygon(points);c.stroke();c.globalAlpha=.055+this.pulse*.04;c.fillStyle=this.form.color;c.fill();c.restore();const visiblePattern=this.appliedPattern||this.patternPreview;if(visiblePattern)this.drawSequence(points,visiblePattern.sequence,{alpha:this.appliedPattern?0.42:0.2,width:this.appliedPattern?1.25:1,dashed:!this.appliedPattern,closed:visiblePattern.closed});if(this.path.length>1){c.save();c.strokeStyle=this.form.color;c.lineWidth=1.2;c.shadowColor=this.form.color;c.shadowBlur=10*this.intensity;c.globalAlpha=.7;c.beginPath();this.path.forEach((index,i)=>{const p=points[index%this.sides];i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)});c.stroke();c.restore()}if(this.activeEdge){const from=points[this.activeEdge.from%this.sides],to=points[this.activeEdge.to%this.sides];c.save();c.strokeStyle='#fff';c.globalAlpha=this.activeEdge.pulse;c.lineWidth=1.5+this.activeEdge.pulse;c.shadowColor=this.form.color;c.shadowBlur=24*this.intensity;c.beginPath();c.moveTo(from.x,from.y);c.lineTo(to.x,to.y);c.stroke();c.restore();this.activeEdge.pulse*=.9;if(this.activeEdge.pulse<.03)this.activeEdge=null}points.forEach((p,i)=>{const active=this.vertexPulses[i]||0;c.fillStyle=this.form.color;c.shadowColor=this.form.color;c.shadowBlur=(12+active*25)*this.intensity;c.beginPath();c.arc(p.x,p.y,3.2+active*4,0,TAU);c.fill();c.shadowBlur=0;if(this.labelMode!=='off'){const dx=p.x-x,dy=p.y-y,length=Math.hypot(dx,dy),lx=p.x+dx/length*18,ly=p.y+dy/length*18;c.fillStyle='#f4f0e8b8';c.font='500 9px "DM Mono"';c.textAlign='center';c.textBaseline='middle';c.fillText(this.labelMode==='number'?i:this.form.names[i],lx,ly)}if(document.activeElement===this.canvas&&i===this.focusedVertex){c.strokeStyle='#fff';c.lineWidth=1;c.beginPath();c.arc(p.x,p.y,12,0,TAU);c.stroke()}this.vertexPulses[i]*=.91});if(this.cyclePulse>.02){c.save();c.strokeStyle=this.form.color;c.globalAlpha=this.cyclePulse*.55;c.lineWidth=1.5;c.shadowColor=this.form.color;c.shadowBlur=22*this.intensity;c.beginPath();c.arc(x,y,outer-2,0,TAU);c.stroke();c.restore();this.cyclePulse*=.92}if(!this.motionReduced)this.angle+=this.rotation*.00005;this.pulse*=.94;requestAnimationFrame(()=>this.draw())}}
