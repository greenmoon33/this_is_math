.panel{position:absolute;z-index:3;top:50%;width:min(260px,28vw);padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 18px 60px #0006;opacity:0;pointer-events:none;transform:translateY(-46%);transition:.25s}.panel.open{opacity:1;pointer-events:auto;transform:translateY(-50%)}.math-panel{right:0}.challenge-panel{left:0}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panel h2{margin:0;font:500 11px/1 "DM Mono";letter-spacing:.14em;text-transform:uppercase}.icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px}.icon-btn:hover{color:var(--ink)}.math-grid{display:grid;grid-template-columns:1fr auto;gap:9px 12px;font:300 10px/1.35 "DM Mono"}.math-grid dt{color:var(--muted)}.math-grid dd{margin:0;color:var(--accent);text-align:right}.formula{margin-top:15px;padding-top:13px;border-top:1px solid var(--line);color:var(--muted);font:300 9px/1.55 "DM Mono"}

.sliders{display:flex;justify-content:center;flex-wrap:wrap;gap:9px 20px;margin:auto;padding-top:10px;border-top:1px solid var(--line);width:min(850px,100%)}.control{display:grid;grid-template-columns:auto 76px auto;align-items:center;gap:7px;color:var(--muted);font:300 8px/1 "DM Mono";text-transform:uppercase;letter-spacing:.07em}.control output{width:28px;color:var(--ink);text-align:right}input[type=range]{width:76px;height:2px;accent-color:var(--accent);cursor:pointer}button:focus-visible,.center-control:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.statusbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:end}.shortcut{color:var(--muted);font:300 8px/1.4 "DM Mono";letter-spacing:.05em;text-transform:uppercase}.shortcut.right{justify-self:end}#dot{display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:#555}.sound-on #dot{background:var(--accent);box-shadow:0 0 12px var(--accent)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

</style></head><body><div class="grain"></div><main>
<header><div class="brand"><span>●</span>&nbsp; This is math</div><div class="micro muted right hint">PLAY THE VERTICES<br>DRAW THE HARMONY</div></header>
<section class="stage">
<aside class="panel challenge-panel" id="challengePanel" aria-hidden="true" inert><div class="panel-head"><h2>Challenge</h2><button class="icon-btn" data-close="challengePanel" aria-label="Close challenge">×</button></div><p id="question"></p><div class="answers" id="answers"></div><div id="feedback" aria-live="polite"></div></aside>
<div class="instrument"><canvas id="pad" tabindex="0" role="application" aria-label="Geometric music pad. Use arrow keys to choose a vertex and Enter to play it."></canvas><button class="center-control" id="playChord" aria-label="Play the full Hexagon chord"><span class="eyebrow">Play chord</span><span id="shape">Hexagon</span><span id="chord">F major 9 · 6 voices</span></button><div class="note-pop" id="notePop" aria-hidden="true"></div></div>

</section><section class="dock" aria-label="Instrument controls">
<nav class="shape-row" aria-label="Choose a polygon"><button class="pill shape" data-n="3">3 Triangle</button><button class="pill shape" data-n="4">4 Square</button><button class="pill shape" data-n="5">5 Pentagon</button><button class="pill shape active" data-n="6">6 Hexagon</button><button class="pill shape" data-n="8">8 Octagon</button></nav>
<div class="action-row"><button class="pill" id="record">● Record</button><button class="pill" id="playSequence">▶ Play</button><button class="pill" id="loop" aria-pressed="false">↻ Loop</button><button class="pill" id="stop">■ Stop</button><button class="pill" id="clear">Clear</button><button class="pill" id="randomize">Surprise me</button><button class="pill" id="mathToggle" aria-expanded="false">Math</button><button class="pill" id="challengeToggle" aria-expanded="false">Challenge</button></div>
<div class="sliders"><label class="control">Rotation <input id="rotation" type="range" min="-100" max="100" value="32"><output id="rotationOut">32</output></label><label class="control">Tempo <input id="tempo" type="range" min="50" max="180" value="96"><output id="tempoOut">96</output></label><label class="control">Octave <input id="octave" type="range" min="-1" max="1" value="0" step="1"><output id="octaveOut">0</output></label><label class="control">Glow <input id="intensity" type="range" min="40" max="140" value="100"><output id="intensityOut">100</output></label></div>

</section></main><div class="sr-only" id="announcement" aria-live="polite"></div>
<script>
const TAU=Math.PI*2,FORMS={3:{name:'Triangle',chord:'C major',color:'#ffbd59',notes:[261.63,329.63,392],names:['C','E','G']},4:{name:'Square',chord:'D minor 7',color:'#6ee7f2',notes:[293.66,349.23,440,523.25],names:['D','F','A','C']},5:{name:'Pentagon',chord:'A minor 9',color:'#ff7eb6',notes:[220,261.63,329.63,392,493.88],names:['A','C','E','G','B']},6:{name:'Hexagon',chord:'F major 9',color:'#d7ff64',notes:[174.61,220,261.63,329.63,392,523.25],names:['F','A','C','E','G','C']},8:{name:'Octagon',chord:'E suspended',color:'#a792ff',notes:[164.81,220,246.94,329.63,369.99,440,493.88,659.25],names:['E','A','B','E','F♯','A','B','E']}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],polygonMath=n=>({interior:(n-2)*180/n,exterior:360/n,sum:(n-2)*180,symmetry:n});
class AudioEngine{constructor(){this.context=null;this.output=null}async ready(){if(!this.context){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Web Audio is unavailable');this.context=new AC;this.output=this.context.createGain();this.output.gain.value=.72;this.output.connect(this.context.destination)}if(this.context.state==='suspended')await this.context.resume();return this.context}async note(frequency,duration=.75,delay=0){const context=await this.ready(),start=context.currentTime+delay,osc=context.createOscillator(),filter=context.createBiquadFilter(),gain=context.createGain();osc.type='triangle';osc.frequency.value=frequency;filter.type='lowpass';filter.frequency.value=1900;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.16,start+.025);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);osc.connect(filter);filter.connect(gain);gain.connect(this.output);osc.start(start);osc.stop(start+duration+.04);osc.onended=()=>{osc.disconnect();filter.disconnect();gain.disconnect()}}chord(form,octave){form.notes.forEach((note,i)=>this.note(note*2**octave,2.2,i*.018))}}
class Sequencer{constructor(onStep,onChange){this.steps=[];this.recording=false;this.looping=false;this.timers=[];this.onStep=onStep;this.onChange=onChange}capture(index){if(this.recording&&this.steps.length<32){this.steps.push(index);this.onChange()}}toggle(){this.recording=!this.recording;this.onChange()}toggleLoop(){this.looping=!this.looping;this.onChange()}stop(){this.timers.forEach(clearTimeout);this.timers=[];this.recording=false;this.onChange()}clear(){this.stop();this.steps=[];this.onChange()}play(tempo){this.stop();if(!this.steps.length)return;const beat=60000/tempo;this.steps.forEach((step,i)=>this.timers.push(setTimeout(()=>this.onStep(step),i*beat)));this.timers.push(setTimeout(()=>{this.timers=[];this.looping?this.play(tempo):this.onChange()},this.steps.length*beat));this.onChange()}get playing(){return this.timers.length>0}}
class Instrument{
constructor(){this.canvas=$('#pad');this.ctx=this.canvas.getContext('2d');this.audio=new AudioEngine;this.sides=6;this.angle=0;this.pulse=0;this.vertexPulses=[];this.path=[];this.focusedVertex=0;this.motionReduced=matchMedia('(prefers-reduced-motion:reduce)').matches;this.rotation=32;this.octave=0;this.intensity=1;this.popTimer=0;this.sequence=new Sequencer(i=>this.playVertex(i,true),()=>this.updateSequenceUI());this.bind();this.fit();this.selectShape(6,false);this.draw()}
get form(){return FORMS[this.sides]}vertices(){const r=Math.min(this.canvas.clientWidth,this.canvas.clientHeight)*.266,x=this.canvas.clientWidth/2,y=this.canvas.clientHeight/2;return Array.from({length:this.sides},(_,i)=>{const a=this.angle-Math.PI/2+i*TAU/this.sides;return{x:x+Math.cos(a)*r,y:y+Math.sin(a)*r}})}fit(){const d=Math.min(devicePixelRatio||1,2),r=this.canvas.getBoundingClientRect();this.canvas.width=Math.round(r.width*d);this.canvas.height=Math.round(r.height*d);this.ctx.setTransform(d,0,0,d,0,0)}
bind(){addEventListener('resize',()=>this.fit());this.canvas.addEventListener('pointerdown',e=>this.canvasPress(e));$('#playChord').addEventListener('click',()=>this.playChord());$$('.shape').forEach(b=>b.addEventListener('click',()=>this.selectShape(+b.dataset.n)));$('#record').addEventListener('click',()=>this.sequence.toggle());$('#playSequence').addEventListener('click',()=>this.sequence.play(+$('#tempo').value));$('#loop').addEventListener('click',()=>this.sequence.toggleLoop());$('#stop').addEventListener('click',()=>this.sequence.stop());$('#clear').addEventListener('click',()=>this.clearPattern());$('#randomize').addEventListener('click',()=>this.randomize());$('#mathToggle').addEventListener('click',()=>this.togglePanel('mathPanel'));$('#challengeToggle').addEventListener('click',()=>{this.togglePanel('challengePanel');this.newChallenge()});$$('[data-close]').forEach(b=>b.addEventListener('click',()=>this.closePanel(b.dataset.close)));['rotation','tempo','octave','intensity'].forEach(id=>$('#'+id).addEventListener('input',e=>this.setControl(id,+e.target.value)));addEventListener('keydown',e=>this.keydown(e));this.canvas.addEventListener('keydown',e=>this.canvasKeydown(e));addEventListener('pagehide',()=>this.sequence.stop())}
setControl(id,value){$('#'+id+'Out').value=value;if(id==='rotation')this.rotation=value;if(id==='octave')this.octave=value;if(id==='intensity')this.intensity=value/100}
selectShape(n,sound=true){this.sequence.clear();this.sides=n;this.path=[];this.focusedVertex=0;this.vertexPulses=Array(n).fill(0);document.documentElement.style.setProperty('--accent',this.form.color);$('#shape').textContent=this.form.name;$('#chord').textContent=`${this.form.chord} · ${n} voices`;$('#playChord').setAttribute('aria-label',`Play the full ${this.form.name} chord`);$$('.shape').forEach(b=>b.classList.toggle('active',+b.dataset.n===n));this.pulse=1;this.updateMath();if($('#challengePanel').classList.contains('open'))this.newChallenge();this.updateSequenceUI();if(sound)this.playChord();this.announce(`${this.form.name}, ${n} vertices`)}
async playVertex(index,fromSequence=false){index=((index%this.sides)+this.sides)%this.sides;this.vertexPulses[index]=1;this.pulse=.25;this.focusedVertex=index;this.path.push(index);if(this.path.length>24)this.path.shift();if(!fromSequence)this.sequence.capture(index);try{await this.audio.note(this.form.notes[index]*2**this.octave)}catch(e){this.audioError(e)}this.showNote(`${this.form.names[index]}${this.octave===0?'':this.octave>0?' ↑':' ↓'}`);this.flashAudio();this.updateSequenceUI()}
async playChord(){try{await this.audio.ready();this.audio.chord(this.form,this.octave)}catch(e){this.audioError(e);return}this.vertexPulses.fill(1);this.pulse=1;this.flashAudio();this.announce(`${this.form.chord} chord`)}
canvasPress(e){const r=this.canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,points=this.vertices();let best=-1,distance=Infinity;points.forEach((p,i)=>{const d=Math.hypot(x-p.x,y-p.y);if(d<distance){distance=d;best=i}});if(distance<34)this.playVertex(best);else if(Math.hypot(x-r.width/2,y-r.height/2)<r.width*.17)this.playChord()}
clearPattern(){this.path=[];this.sequence.clear();this.pulse=.45;this.announce('Pattern cleared')}randomize(){const keys=Object.keys(FORMS),n=+keys[Math.floor(Math.random()*keys.length)];this.selectShape(n,false);this.rotation=(Math.random()>.5?1:-1)*(20+Math.floor(Math.random()*65));$('#rotation').value=this.rotation;$('#rotationOut').value=this.rotation;this.sequence.steps=Array.from({length:Math.min(8,n+2)},()=>Math.floor(Math.random()*n));this.path=[];this.updateSequenceUI();this.sequence.play(+$('#tempo').value);this.announce(`Surprise ${this.form.name} sequence`)}
togglePanel(id){const panel=$('#'+id),open=!panel.classList.contains('open');['mathPanel','challengePanel'].forEach(p=>p===id?0:this.closePanel(p));panel.classList.toggle('open',open);panel.toggleAttribute('inert',!open);panel.setAttribute('aria-hidden',String(!open));$('#'+(id==='mathPanel'?'mathToggle':'challengeToggle')).setAttribute('aria-expanded',String(open))}closePanel(id){const panel=$('#'+id);panel.classList.remove('open');panel.setAttribute('inert','');panel.setAttribute('aria-hidden','true');$(id==='mathPanel'?'#mathToggle':'#challengeToggle').setAttribute('aria-expanded','false')}
updateMath(){const m=polygonMath(this.sides),fmt=v=>Number.isInteger(v)?v:v.toFixed(1);$('#mathGrid').innerHTML=`<dt>Sides</dt><dd>${this.sides}</dd><dt>Vertices</dt><dd>${this.sides}</dd><dt>Interior angle</dt><dd>${fmt(m.interior)}°</dd><dt>Exterior angle</dt><dd>${fmt(m.exterior)}°</dd><dt>Angle sum</dt><dd>${m.sum}°</dd><dt>Rotational order</dt><dd>${m.symmetry}</dd>`;$('#formula').textContent=`Interior angle: (${this.sides} − 2) × 180° ÷ ${this.sides} = ${fmt(m.interior)}°`}
newChallenge(){const m=polygonMath(this.sides),items=[['How many vertices does this polygon have?',this.sides],['What is each exterior angle?',m.exterior],['What is the sum of its interior angles?',m.sum],['How many lines of symmetry does it have?',m.symmetry]],pick=items[Math.floor(Math.random()*items.length)],correct=Math.round(pick[1]*10)/10,values=new Set([correct]);while(values.size<4)values.add(Math.max(1,correct+[-20,-10,-2,-1,1,2,10,20][Math.floor(Math.random()*8)]));$('#question').textContent=pick[0];$('#answers').innerHTML='';$('#feedback').textContent='';[...values].sort(()=>Math.random()-.5).forEach(value=>{const b=document.createElement('button');b.className='answer';b.textContent=`${value}${pick[0].includes('angle')?'°':''}`;b.addEventListener('click',()=>{const ok=value===correct;b.classList.add(ok?'correct':'wrong');$('#feedback').textContent=ok?'Exactly — geometry in tune.':'Not quite. Follow the polygon, then try again.';if(ok)setTimeout(()=>this.newChallenge(),1100)});$('#answers').appendChild(b)})}
keydown(e){if(e.target.tagName==='INPUT')return;const number=+e.key;if(FORMS[number]){e.preventDefault();this.selectShape(number);return}if(e.code==='Space'){e.preventDefault();this.playChord()}else if(e.key.toLowerCase()==='r'){e.preventDefault();this.randomize()}else if(e.key.toLowerCase()==='c'){e.preventDefault();this.clearPattern()}}canvasKeydown(e){if(['ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();this.focusedVertex=(this.focusedVertex+1)%this.sides;this.announce(`Vertex ${this.focusedVertex+1}, note ${this.form.names[this.focusedVertex]}`)}else if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();this.focusedVertex=(this.focusedVertex-1+this.sides)%this.sides;this.announce(`Vertex ${this.focusedVertex+1}, note ${this.form.names[this.focusedVertex]}`)}else if(e.key==='Enter'){e.preventDefault();this.playVertex(this.focusedVertex)}}
updateSequenceUI(){const s=this.sequence;$('#record').classList.toggle('recording',s.recording);$('#record').textContent=s.recording?'■ Recording':'● Record';$('#loop').classList.toggle('active',s.looping);$('#loop').setAttribute('aria-pressed',String(s.looping));$('#sequenceStatus').textContent=s.recording?`Recording · ${s.steps.length} notes`:s.playing?`${s.looping?'Looping':'Playing'} · ${s.steps.length} notes`:s.steps.length?`${s.steps.length} note sequence`:(this.path.length?`${this.path.length} vertex pattern`:'Pattern empty')}showNote(text){const el=$('#notePop');el.textContent=text;el.classList.add('show');clearTimeout(this.popTimer);this.popTimer=setTimeout(()=>el.classList.remove('show'),650);this.announce(`Note ${text}`)}flashAudio(){$('#audioStatus').classList.add('sound-on');setTimeout(()=>$('#audioStatus').classList.remove('sound-on'),600)}audioError(error){$('#audioStatus').textContent='Audio unavailable';this.announce(error.message)}announce(text){$('#announcement').textContent=text}
drawPolygon(points){const c=this.ctx;c.beginPath();points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath()}
draw(){const c=this.ctx,w=this.canvas.clientWidth,h=this.canvas.clientHeight,x=w/2,y=h/2,outer=Math.min(w,h)*.475,points=this.vertices();c.clearRect(0,0,w,h);c.lineWidth=1;c.strokeStyle='#f4f0e829';c.beginPath();c.arc(x,y,outer,0,TAU);c.stroke();for(let r=1;r<=3;r++){c.strokeStyle=`rgba(244,240,232,${.025+r*.008})`;c.beginPath();c.arc(x,y,outer*r/4,0,TAU);c.stroke()}for(let i=0;i<24;i++){const a=i*TAU/24,z=outer*(i%6===0?.94:.97);c.strokeStyle=i%6===0?'#f4f0e838':'#f4f0e814';c.beginPath();c.moveTo(x+Math.cos(a)*z,y+Math.sin(a)*z);c.lineTo(x+Math.cos(a)*outer,y+Math.sin(a)*outer);c.stroke()}c.save();c.shadowColor=this.form.color;c.shadowBlur=(20+this.pulse*24)*this.intensity;c.strokeStyle=this.form.color;c.lineWidth=1.5;this.drawPolygon(points);c.stroke();c.globalAlpha=.055+this.pulse*.04;c.fillStyle=this.form.color;c.fill();c.restore();if(this.path.length>1){c.save();c.strokeStyle=this.form.color;c.lineWidth=1.2;c.shadowColor=this.form.color;c.shadowBlur=10*this.intensity;c.globalAlpha=.7;c.beginPath();this.path.forEach((index,i)=>{const p=points[index%this.sides];i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)});c.stroke();c.restore()}points.forEach((p,i)=>{const active=this.vertexPulses[i]||0;c.fillStyle=this.form.color;c.shadowColor=this.form.color;c.shadowBlur=(12+active*25)*this.intensity;c.beginPath();c.arc(p.x,p.y,3.2+active*4,0,TAU);c.fill();c.shadowBlur=0;if(document.activeElement===this.canvas&&i===this.focusedVertex){c.strokeStyle='#fff';c.lineWidth=1;c.beginPath();c.arc(p.x,p.y,12,0,TAU);c.stroke()}this.vertexPulses[i]*=.91});if(!this.motionReduced)this.angle+=this.rotation*.00005;this.pulse*=.94;requestAnimationFrame(()=>this.draw())}}
new Instrument;
</script></body></html>
